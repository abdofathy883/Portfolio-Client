<section class="hero container py-4">
  <div class="row d-flex align-items-center">
    <div class="col-12 col-lg-6 mb-3 text-end">
      <h1 class="display-4 fw-bold" id="projectTitle">
        {{ project.translations[0].title }}
      </h1>
      <div id="techBadges">
        <span class="badge bg-primary me-1 mb-1">Angular</span>
        <span class="badge bg-secondary me-1 mb-1">.NET Core</span>
      </div>
      <p class="lead" id="projectTagline">
        {{ project.translations[0].description }}
      </p>
      <div class="mb-3">
        @if (project.liveUrl) {
          <a
            [href]="project.liveUrl"
            id="liveUrl"
            class="btn btn-primary"
            target="_blank"
            >View Live</a
          >
        } @if (project.demoUrl) {
          <a
            [href]="project.demoUrl"
            id="demoUrl"
            class="btn btn-outline-secondary me-3"
            target="_blank"
            >View Demo</a
          >
        }
      </div>
    </div>

    <div class="col-12 col-lg-6 mb-3">
      <img
        [src]="project.imageLink"
        [alt]="project.translations[0].imageAltText"
        class="img-fluid d-block mx-auto rounded shadow"
      />
      <!-- <img
        [src]="project.imageLink"
        [alt]="project.translations[0].imageAltText"
        class="d-block mx-auto"
      /> -->
      <!-- <video id="projectVideo" class="img-fluid rounded shadow" controls poster="fallback.jpg">
        <source src="video.mp4" type="video/mp4">
      </video> -->
    </div>
  </div>
</section>

<section class="container py-4">
  <div class="row d-flex align-items-center">
    <div class="col-md-6">
      <h3 class="fw-bold">The Problem</h3>
      <p id="projectProblem">{{ project.translations[0].problem }}</p>
    </div>
    <div class="col-md-6">
      <h3 class="fw-bold">Our Solution</h3>
      <p id="projectSolution">{{ project.translations[0].solution }}</p>
    </div>
  </div>
</section>
